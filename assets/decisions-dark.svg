<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 450" width="860" height="450" role="img" aria-label="Decision log: five architecture decision records with the outcome each one produced">
  <title>decisions — the calls and what they cost</title>
  <style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .h-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .h-sub   { font-size: 13px; fill: #8b949e; }

  .d-id    { font-size: 11px; letter-spacing: 1.4px; fill: #5a6675; }
  .d-title { font-size: 14px; fill: #e6edf3; }
  .d-out   { font-size: 12px; fill: #39d3bb; }
</style>
  <defs><filter id="glow" x="-300%" y="-300%" width="700%" height="700%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter></defs>
  <rect width="860" height="450" rx="14" fill="#0b0f14"/>
  <rect x="0.5" y="0.5" width="859" height="449" rx="14" fill="none" stroke="#2b333d"/>
  <text class="mono h-title" x="32" y="44" fill="#e6edf3">decisions<tspan fill="#ff6b4a">.log</tspan></text>
  <text class="mono h-sub" x="32" y="66">five calls, and the bill each one came with</text>
  <path d="M32,84 H828" stroke="#2b333d" stroke-width="1"/>
  <path id="spine" d="M60,100 V424" stroke="#2b333d" stroke-width="1.5" fill="none"/>
  <g>
    <circle cx="60" cy="118" r="16" fill="none" stroke="#39d3bb" opacity="0">
      <animate attributeName="r" values="9;22" dur="0.8s" begin="0.28s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.8s" begin="0.28s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="118" r="8" fill="#0b0f14" stroke="#ff6b4a" stroke-width="2.2"/>
    <text class="mono d-id" x="92" y="123">ADR-001</text>
    <text class="mono d-title" x="182" y="123">refuse rather than guess</text>
    <text class="mono d-out" x="828" y="123" text-anchor="end">0% false hits</text>
  </g>
  <g>
    <circle cx="60" cy="190" r="16" fill="none" stroke="#39d3bb" opacity="0">
      <animate attributeName="r" values="9;22" dur="0.8s" begin="1.39s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.8s" begin="1.39s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="190" r="8" fill="#0b0f14" stroke="#ff6b4a" stroke-width="2.2"/>
    <text class="mono d-id" x="92" y="195">ADR-002</text>
    <text class="mono d-title" x="182" y="195">postgres is the queue</text>
    <text class="mono d-out" x="828" y="195" text-anchor="end">one less system to run</text>
  </g>
  <g>
    <circle cx="60" cy="262" r="16" fill="none" stroke="#39d3bb" opacity="0">
      <animate attributeName="r" values="9;22" dur="0.8s" begin="2.50s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.8s" begin="2.50s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="262" r="8" fill="#0b0f14" stroke="#ff6b4a" stroke-width="2.2"/>
    <text class="mono d-id" x="92" y="267">ADR-003</text>
    <text class="mono d-title" x="182" y="267">cache-aside, never write-through</text>
    <text class="mono d-out" x="828" y="267" text-anchor="end">6× faster reads</text>
  </g>
  <g>
    <circle cx="60" cy="334" r="16" fill="none" stroke="#39d3bb" opacity="0">
      <animate attributeName="r" values="9;22" dur="0.8s" begin="3.61s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.8s" begin="3.61s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="334" r="8" fill="#0b0f14" stroke="#ff6b4a" stroke-width="2.2"/>
    <text class="mono d-id" x="92" y="339">ADR-004</text>
    <text class="mono d-title" x="182" y="339">fail over, don't retry harder</text>
    <text class="mono d-out" x="828" y="339" text-anchor="end">44% failover, held</text>
  </g>
  <g>
    <circle cx="60" cy="406" r="16" fill="none" stroke="#39d3bb" opacity="0">
      <animate attributeName="r" values="9;22" dur="0.8s" begin="4.72s"
               repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0" dur="0.8s" begin="4.72s"
               repeatCount="indefinite"/>
    </circle>
    <circle cx="60" cy="406" r="8" fill="#0b0f14" stroke="#ff6b4a" stroke-width="2.2"/>
    <text class="mono d-id" x="92" y="411">ADR-005</text>
    <text class="mono d-title" x="182" y="411">read the plan before the query</text>
    <text class="mono d-out" x="828" y="411" text-anchor="end">up to 20,000×</text>
  </g>
  <circle r="4.5" fill="#39d3bb" filter="url(#glow)">
    <animateMotion dur="5.0s" repeatCount="indefinite">
      <mpath href="#spine"/></animateMotion>
  </circle>
</svg>
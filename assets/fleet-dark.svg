<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 576" width="860" height="576" role="img" aria-label="Fleet status board: eight service tiles with status lamps">
  <title>fleet — service status</title>
  <style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .h-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .h-sub   { font-size: 13px; fill: #8b949e; }

  .f-name { font-size: 15px; fill: #e6edf3; }
  .f-l1   { font-size: 12.5px; fill: #8b949e; }
  .f-l2   { font-size: 11.5px; fill: #5a6675; }
  .f-tag  { font-size: 10.5px; letter-spacing: 1.1px; }
</style>
  <defs><linearGradient id="sweep" x1="0" x2="1">
    <stop offset="0" stop-color="#39d3bb" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#39d3bb" stop-opacity="0.08"/>
    <stop offset="1" stop-color="#39d3bb" stop-opacity="0"/>
  </linearGradient></defs>
  <rect width="860" height="576" rx="14" fill="#0b0f14"/>
  <rect x="0.5" y="0.5" width="859" height="575" rx="14" fill="none" stroke="#2b333d"/>
  <text class="mono h-title" x="32" y="44" fill="#e6edf3">fleet<tspan fill="#ff6b4a">.status</tspan></text>
  <text class="mono h-sub" x="32" y="66">eight services · one of them is answering requests right now</text>
  <path d="M32,84 H828" stroke="#2b333d" stroke-width="1"/>
  <g>
    <rect x="32" y="100" width="388" height="100" rx="11"
          fill="#11161d" stroke="#39d3bb"/>
    <circle cx="54" cy="128" r="5" fill="#39d3bb"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="1.6s" begin="0.0s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="72" y="133">health-assistant</text>
    <text class="mono f-tag" x="404" y="132" text-anchor="end"
          fill="#39d3bb">LIVE</text>
    <text class="mono f-l1" x="54" y="163">90% hit · 0% false hits</text>
    <text class="mono f-l2" x="54" y="185">p50 2512ms · 100% cited</text>
  </g>
  <g>
    <rect x="440" y="100" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="462" cy="128" r="5" fill="#ff6b4a"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="3.4s" begin="0.25s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="480" y="133">codity</text>
    <text class="mono f-tag" x="812" y="132" text-anchor="end"
          fill="#ff6b4a">SHIPPED</text>
    <text class="mono f-l1" x="462" y="163">exactly-once · 10 workers</text>
    <text class="mono f-l2" x="462" y="185">58 endpoints · 48 CI tests</text>
  </g>
  <g>
    <rect x="32" y="216" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="54" cy="244" r="5" fill="#ff6b4a"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="3.4s" begin="0.5s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="72" y="249">readr</text>
    <text class="mono f-tag" x="404" y="248" text-anchor="end"
          fill="#ff6b4a">SHIPPED</text>
    <text class="mono f-l1" x="54" y="279">pdf → grounded answer</text>
    <text class="mono f-l2" x="54" y="301">per-user + per-thread isolation</text>
  </g>
  <g>
    <rect x="440" y="216" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="462" cy="244" r="5" fill="#ff6b4a"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="3.4s" begin="0.75s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="480" y="249">url-shortener</text>
    <text class="mono f-tag" x="812" y="248" text-anchor="end"
          fill="#ff6b4a">SHIPPED</text>
    <text class="mono f-l1" x="462" y="279">40ms → 6.7ms cached</text>
    <text class="mono f-l2" x="462" y="301">94% coverage · 22 tests</text>
  </g>
  <g>
    <rect x="32" y="332" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="54" cy="360" r="5" fill="#ff6b4a"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="3.4s" begin="1.0s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="72" y="365">support-copilot</text>
    <text class="mono f-tag" x="404" y="364" text-anchor="end"
          fill="#ff6b4a">SHIPPED</text>
    <text class="mono f-l1" x="54" y="395">multi-tenant backend</text>
    <text class="mono f-l2" x="54" y="417">alembic migrations, versioned</text>
  </g>
  <g>
    <rect x="440" y="332" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="462" cy="360" r="5" fill="#ff6b4a"><animate attributeName="opacity" values="0.25;1.0;0.25" dur="3.4s" begin="1.25s" repeatCount="indefinite"/></circle>
    <text class="mono f-name" x="480" y="365">ai-gateway</text>
    <text class="mono f-tag" x="812" y="364" text-anchor="end"
          fill="#ff6b4a">SHIPPED</text>
    <text class="mono f-l1" x="462" y="395">ordered provider chain</text>
    <text class="mono f-l2" x="462" y="417">dead provider ≠ dead request</text>
  </g>
  <g>
    <rect x="32" y="448" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="54" cy="476" r="5" fill="#5a6675"></circle>
    <text class="mono f-name" x="72" y="481">pg-tuning</text>
    <text class="mono f-tag" x="404" y="480" text-anchor="end"
          fill="#5a6675">LAB</text>
    <text class="mono f-l1" x="54" y="511">1M synthetic rows</text>
    <text class="mono f-l2" x="54" y="533">up to 20,000× via indexes</text>
  </g>
  <g>
    <rect x="440" y="448" width="388" height="100" rx="11"
          fill="#11161d" stroke="#2b333d"/>
    <circle cx="462" cy="476" r="5" fill="#5a6675"></circle>
    <text class="mono f-name" x="480" y="481">cloudbeat</text>
    <text class="mono f-tag" x="812" y="480" text-anchor="end"
          fill="#5a6675">LAB</text>
    <text class="mono f-l1" x="462" y="511">spotify oauth + 3D</text>
    <text class="mono f-l2" x="462" y="533">60fps spline scene</text>
  </g>
  <rect x="0" y="94" width="200" height="470" fill="url(#sweep)">
    <animate attributeName="x" values="-200;860" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>
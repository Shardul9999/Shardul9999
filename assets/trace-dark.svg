  <text class="mono note" x="365" y="271" opacity="0">← the safety path short-circuits before retrieval, before the model<animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.3714;0.4000;0.93;1"/></text>
  <text class="mono note" x="505" y="421" opacity="0">← 6× faster, and the cache is never the source of truth<animate attributeName="opacity" dur="7.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.5214;0.5500;0.93;1"/></text>

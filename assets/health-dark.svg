<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="A terminal running a health check against shardul.sys">
  <title>health — still up</title>
  <style>
  .mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .h-title { font-size: 26px; font-weight: 700; letter-spacing: -0.3px; }
  .h-sub   { font-size: 13px; fill: #8b949e; }

  .t-bar  { font-size: 12px; fill: #8b949e; }
  .t-cmd  { font-size: 14px; fill: #e6edf3; }
  .t-key  { font-size: 14px; fill: #ff6b4a; }
  .t-str  { font-size: 14px; fill: #39d3bb; }
  .t-punc { font-size: 14px; fill: #8b949e; }
</style>
  <rect width="860" height="360" rx="14" fill="#0b0f14"/>
  <rect x="0.5" y="0.5" width="859" height="359" rx="14" fill="none" stroke="#2b333d"/>
  <path d="M0,38 H860" stroke="#2b333d"/>
  <circle cx="28" cy="19" r="6" fill="#ff5f57" opacity="0.85"/>
  <circle cx="48" cy="19" r="6" fill="#febc2e" opacity="0.85"/>
  <circle cx="68" cy="19" r="6" fill="#28c840" opacity="0.85"/>
  <text class="mono t-bar" x="430" y="24" text-anchor="middle">shardul.sys — health check</text>
  <text class="mono t-str" x="32" y="86">$</text>
  <defs><clipPath id="typing">
    <rect x="49" y="71" width="0" height="22">
      <animate attributeName="width" dur="9.0s" repeatCount="indefinite"
               values="0;0;328;328;0" keyTimes="0;0.02;0.198;0.95;1"/>
    </rect></clipPath></defs>
  <g clip-path="url(#typing)"><text class="mono t-cmd" x="49" y="86">curl -s https://shardul.sys/health | jq</text></g>
  <rect y="73" width="9" height="18" fill="#39d3bb" opacity="0.85">
    <animate attributeName="x" dur="9.0s" repeatCount="indefinite"
             values="49;49;376;376"
             keyTimes="0;0.02;0.198;1"/>
    <animate attributeName="opacity" values="0.85;0.85;0;0" dur="9.0s"
             keyTimes="0;0.238;0.258;1" repeatCount="indefinite"/>
  </rect>
  <text class="mono" x="32" y="134" opacity="0"><tspan class="t-punc" xml:space="preserve">{</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.237;0.257;0.95;1"/></text>
  <text class="mono" x="32" y="160" opacity="0"><tspan class="t-key" xml:space="preserve">  "status":  </tspan><tspan class="t-str" xml:space="preserve">"up"</tspan><tspan class="t-punc" xml:space="preserve">,</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.272;0.292;0.95;1"/></text>
  <text class="mono" x="32" y="186" opacity="0"><tspan class="t-key" xml:space="preserve">  "region":  </tspan><tspan class="t-str" xml:space="preserve">"in-nanded-1"</tspan><tspan class="t-punc" xml:space="preserve">,</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.307;0.327;0.95;1"/></text>
  <text class="mono" x="32" y="212" opacity="0"><tspan class="t-key" xml:space="preserve">  "live":    </tspan><tspan class="t-str" xml:space="preserve">["health-assistant"]</tspan><tspan class="t-punc" xml:space="preserve">,</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.342;0.362;0.95;1"/></text>
  <text class="mono" x="32" y="238" opacity="0"><tspan class="t-key" xml:space="preserve">  "open_to": </tspan><tspan class="t-str" xml:space="preserve">"backend · infra · ai-systems work"</tspan><tspan class="t-punc" xml:space="preserve">,</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.377;0.397;0.95;1"/></text>
  <text class="mono" x="32" y="264" opacity="0"><tspan class="t-key" xml:space="preserve">  "reach":   </tspan><tspan class="t-str" xml:space="preserve">"portfolio · linkedin · leetcode · email"</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.412;0.432;0.95;1"/></text>
  <text class="mono" x="32" y="290" opacity="0"><tspan class="t-punc" xml:space="preserve">}</tspan><animate attributeName="opacity" dur="9.0s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.447;0.467;0.95;1"/></text>
  <rect x="32" y="302" width="9" height="18"
        fill="#39d3bb" opacity="0">
    <animate attributeName="opacity" dur="9.0s" repeatCount="indefinite"
             values="0;0;0.9;0;0.9;0;0.9;0" keyTimes="0;0.532;0.562;0.592;0.622;0.652;0.682;0.712;1"/>
  </rect>
</svg>